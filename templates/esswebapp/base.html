{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Ek Se Sreshtha{% endblock %}</title>
    <meta name="csrf-token" content="{{ csrf_token }}">
    <meta name="app-config" content='{"pageSize": 50}'>

    <!-- Fonts: Inter for a clean, modern feel -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Global styling -->
    <link rel="stylesheet" href="{% static 'esswebapp/css/variables.css' %}">
    <link rel="stylesheet" href="{% static 'esswebapp/css/base.css' %}">
    <link rel="stylesheet" href="{% static 'esswebapp/css/components.css' %}">
    <link rel="stylesheet" href="{% static 'esswebapp/css/layout.css' %}">
    <link rel="stylesheet" href="{% static 'esswebapp/css/constituency.css' %}">
    
    <!-- Select2 for searchable dropdowns -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/select2-bootstrap-5-theme@1.3.0/dist/select2-bootstrap-5-theme.min.css">
    
    {% block extra-css %}{% endblock %}
</head>
<body
{% block body-attributes %}
    data-user-session='{{ user|default:"{}"|safe }}'
    data-url-logo="{% static 'esswebapp/assets/logo.png' %}"
    data-url-dashboard="{% url 'esswebapp:dashboard' %}"
    data-url-centres="{% url 'esswebapp:centres' %}"
    data-url-attendance="{% url 'esswebapp:attendance' %}"
    data-url-center-detail="{% url 'esswebapp:center-detail' %}"
    data-url-students="{% url 'esswebapp:students' %}"
    data-url-student-list="{% url 'esswebapp:students' %}"
    data-url-student-attendance-history="{% url 'esswebapp:student-attendance-history' %}"
    data-url-student-monthly-attendance="{% url 'esswebapp:student-monthly-attendance' %}"
    data-url-student-daily-attendance="{% url 'esswebapp:student-daily-attendance' %}"
    data-url-center-monthly-attendance="{% url 'esswebapp:center-monthly-attendance' %}"
    data-url-users="{% url 'esswebapp:users' %}"
    data-url-logout="{% url 'esswebapp:logout' %}"
    data-url-district="{% url 'esswebapp:district' %}"
    data-url-vidhan-sabha="{% url 'esswebapp:vidhan-sabha' %}"
    data-url-panchayat="{% url 'esswebapp:panchayat' %}"
    data-url-village="{% url 'esswebapp:village' %}"
    data-url-super-admin="{% url 'esswebapp:super-admin' %}"
    data-url-regional-admin="{% url 'esswebapp:regional-admin' %}"
    data-url-teacher="{% url 'esswebapp:teacher' %}"
    data-url-student-registration="{% url 'esswebapp:student-registration' %}"
    data-url-school-details-list="{% url 'esswebapp:school-details-list' %}"
    data-url-school-dropdown-list="{% url 'esswebapp:school-dropdown-list' %}"
{% endblock %}>

    {% block content %}
        <!-- ============================================================
          APP SHELL
          The sidebar.js script will inject the sidebar and topbar
          around whatever content lives inside this div.
          ============================================================ -->
        <div id="app-shell">
            {% block page-content %}
                <!-- Page-specific content goes here -->
            {% endblock %}
        </div>

        <!-- Scripts -->
        <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
        <script src="{% static 'esswebapp/js/common.js' %}"></script>
        <script src="{% static 'esswebapp/js/sidebar.js' %}"></script>
        {% block extra-js %}{% endblock %}
    {% endblock %}
    
</body>
</html>
